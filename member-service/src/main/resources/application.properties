# ---------- Member Service ----------
spring.application.name=member-service
server.port=8081

# ---------- H2 in-memory database ----------
spring.datasource.url=jdbc:h2:mem:memberdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 web console: http://localhost:8081/h2-console  (JDBC URL jdbc:h2:mem:memberdb)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- Actuator (Kubernetes probes) ----------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

logging.level.com.bits.library=INFO
